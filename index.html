<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b3821">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reparto Live">
  <title>Reparto Live</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="./styles.css?v=94">
  <link rel="stylesheet" href="./auth.css?v=131">
  <link rel="stylesheet" href="./design-v76.css?v=111">
  <link rel="stylesheet" href="./serioplast-v95.css?v=136">
</head>
<body>
  <header>
    <div class="brand-lockup"><img class="header-wordmark" src="./brand-logo.jpg" alt="Serioplast"><span class="brand-mark"><img src="./brand-bottle.png" alt=""></span><div><h1 id="appTitle">Reparto Live</h1><p id="appSubtitle">Produzione e controlli di reparto</p></div></div>
    <div id="identity" class="identity"></div>
  </header>
  <section id="previewBanner" class="preview-banner" hidden></section>
  <section id="access" class="access-card"></section>
  <main id="areaHome" hidden></main>
  <main id="checklistApp" hidden></main>
  <main id="shiftsApp" hidden></main>
  <main id="logisticsApp" hidden></main>
  <main id="app" hidden>
    <div class="legend"><span class="green">In corso</span><span class="orange">Pre-raclage</span><span class="yellow">Raclage</span><span class="blue">Scarico</span><span class="red">Finito</span></div>
    <section id="productionQuickTools" class="production-quick-tools" aria-label="Comunicazioni e resi" hidden>
      <section id="productionTeamChatHome" hidden></section>
      <section id="lineReturnsWidget" class="line-returns-widget" hidden></section>
    </section>
    <div id="homeLineToolbar" class="home-line-toolbar" hidden>
      <button type="button" class="home-bottle-add" onclick="showBottleEditorMenu()" aria-label="Crea o modifica flacone"><span aria-hidden="true">＋</span><strong>Crea o modifica flacone</strong></button>
    </div>
    <section id="lines" class="lines" aria-label="Linee"></section>
    <section class="workspace">
      <div id="panel" class="panel"></div>
      <aside id="sectionActivity"><div id="handover"></div><h2 id="activityHeading">Attività</h2><div id="activity"></div></aside>
    </section>
  </main>
  <nav id="ctBottomNav" class="ct-bottom-nav" aria-label="Navigazione Capoturno" hidden></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>window.addEventListener('error',e=>{const x=document.getElementById('access');if(x&&!x.textContent)x.innerHTML='<h2>Errore di apertura</h2><p>'+e.message+'</p>'})</script>
  <script src="./supabase.js?v=8"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="./codifica-catalog.js?v=131"></script>
  <script src="./app.js?v=136"></script>
</body>
</html>
